# Single source of truth for every backend hyperparameter.
# Paths are relative to the repo root (resolved by backend/common/config.py).

seed: 0

paths:
  sessions: data/sessions        # real recordings (committed by the frontend)
  synth: backend/_synth          # synthetic sessions (git-ignored)
  models: data/models            # trained models (git-ignored)
  gestures: data/gestures.json   # written by the frontend UI

frame:
  hop_s: 0.02                    # 50 Hz common grid
  max_wait_s: 0.15               # live: max time to wait for a late modality before emitting a frame

emg:
  fs: 1000
  frame_len: 20                  # samples per 20 ms frame
  hp_hz: 20.0
  hp_order: 2
  notch_hz: 60.0
  notch_q: 30.0
  zc_thresh: 1.0                 # deadzone for zero crossings / slope sign changes, in rest-std units
  log_clip: 300.0                # clip amplitude features at this many x rest-noise before log
  rest_skip_s: 1.0               # skip filter transient at the start of a rest period
  rest_std_floor: 1.0            # ADC counts
  rail_lo: 8                     # samples <= rail_lo or >= rail_hi count as clipped (pad off / floating input)
  rail_hi: 4087
  rail_frac: 0.2                 # frames with more clipped samples than this -> EMG masked for that frame

imu:
  fs: 200
  # Mounting (from Jerry, 2026-11-07): back of RIGHT hand, palm down:
  #   +x -> fingertips, -y -> thumb side (+y -> pinky side), -z -> up (out of back of hand).
  # So at rest the accelerometer reads about [0, 0, -1] g.
  axis_fingers: [1, 0, 0]
  axis_thumb: [0, -1, 0]
  axis_up: [0, 0, -1]
  mode: body                     # IMU features for NEW models: body = no gravity direction (works whichever way the
                                 # arm points), motion relative to the hand kept; magnitude = direction-free only;
                                 # raw = old behaviour (gravity kept). Each model stores its own mode.
  aa_hz: 20.0                    # anti-alias low-pass before averaging to 50 Hz
  acc_hp_hz: 0.5                 # high-passed accel copy (gravity removed)

hand:
  hold_s: 0.10                   # hold last valid landmarks at most this long
  lag_s: 0.16                    # frame T uses landmarks stamped <= T - lag_s (offline AND live), so live frames
                                 # need not wait for the webcam. Jerry measured hand msgs arriving ~150 ms after t
                                 # (114 ms calibrated latency + inference). The server reports the measured lag.
  default_img_w: 640             # used when meta.json has no img_w/img_h
  default_img_h: 480
  vel_clip: 5.0                  # wrist velocity clip (image units / s)

labels:
  edge_ignore_s: 0.10            # ignore frames just outside the localised span
  merge_gap_s: 0.15              # hold: merge active spans separated by less than this
  merge_gap_instant_s: 0.04      # instant: keep rapid repeated taps (~60-100 ms apart) as separate occurrences
  min_span_s: 0.10
  k_abs: 3.0                     # activity must exceed this robust z ... (real IMU+camera pinches peak ~3-5)
  k_rel: 0.30                    # ... and this fraction of the window's peak
  smooth_frames: 5
  floors: {emg: 0.05, gyro: 5.0, hand: 0.3}   # MAD floors for robust z
  fallback_half_s: 0.25          # instant fallback span = window centre +- this
  multi_burst: false             # instant: true = every strong burst is its own occurrence (repeated taps);
                                 # false = strongest burst only, other strong bursts ignored (compound motions)
  burst_rel: 0.5                 # 'strong' = peak >= this x the window's strongest burst
  ignore_active_gaps: true       # active frames in unlabelled relax gaps -> ignore (not none)
  pre_cue_s: 0.5                 # also search for the motion this long before the cue starts (anticipation)
  hold_to_cue_end: true          # hold: label onset .. cue end (the held pose itself), not just the onset burst
  hold_release_gap_s: 0.4        # hold: a burst this long after the onset burst, inside the cue = early release

split:
  mode: stratified               # stratified: last val_frac of each gesture's reps (and of each free block) in EVERY
                                 #   session is validation, so sessions may hold different gestures (teach flow).
                                 # newest_session: the newest session is validation, whole (the old behaviour).
                                 # `train` may also pass val_sessions=[ids] to hold out whole sessions explicitly.
  val_frac: 0.2
  min_trials_for_val: 3          # a gesture with fewer reps than this in a session stays all-train there

baseline:
  win_frames: 20                 # 400 ms windows
  none_subsample: 2              # keep every n-th 'none' training frame
  shrinkage: auto

model:
  branch_ch: 32
  fuse_ch: 64
  kernel: 3
  dilations: [1, 2, 4, 8, 16]
  branch_dilations: [1, 2]
  dropout: 0.3                   # M6: 0.1 overfit badly on real EMG (val loss best at step ~150 of 800)

train:
  warm_steps: 150                # steps when warm-starting from the previous model (most weights already fit)
  steps: 400                     # ~1 min on a laptop CPU. M6: on real data the best checkpoint is at 100-200
  batch: 32
  win_frames: 160                # 3.2 s training windows (100 labelled frames after warm-up)
  warmup_frames: 60              # no loss on the first frames of a window (not enough history)
  lr: 0.003
  weight_decay: 0.01
  class_weight_pow: 0.5          # weight = (1/freq)^pow, normalised
  gesture_window_frac: 0.5       # fraction of windows centred on a gesture span
  eval_every: 50
  min_val_occurrences: 6         # fewer validation gestures than this -> keep final weights (no selection)
  threads: 4
  aug:
    time_warp: 0.10
    emg_scale: [0.7, 1.3]
    noise: 0.05
    rot_deg: 15
    # Modality dropout at sensor weight 1.0. A weight w < 1 raises that sensor's dropout towards max_drop and adds
    # feature noise (weight_noise x (1-w)), so the model can't lean on it: drop = base + (1-w) x (max_drop - base).
    drop_emg: 0.10
    drop_imu: 0.10
    drop_hand: 0.15
    max_drop: 0.75
    weight_noise: 0.5            # extra N(0, s) on standardised features of a sensor at weight 0
    hand_gap_p: 0.3              # chance of a random hand-lost segment inside a window
    hand_shift: 0.15             # wrist image position offset per window (camera framing differs per session)
    hand_scale: [0.8, 1.25]      # palm size / wrist speed scale per window (distance to the camera)
  # Default influence per sensor, 0..1 (M6, Jerry's ask: EMG doesn't transfer between sessions, so keep it low).
  # `train` may override with "sensor_weights": {"emg": 0.2, ...}. 0 = same as leaving the sensor out.
  sensor_weights: {emg: 0.2, imu: 1.0, hand: 1.0}
  live_window_frames: 96         # live: re-run the model on the last ~1.9 s (> receptive field)

events:
  ema_alpha: 0.5
  on_thr: 0.6
  off_thr: 0.4
  k_on: 2
  k_off: 3                       # exit only after this many frames below off_thr (debounce)
  refractory_s: 0.4
  match_slack_s: 0.3             # detection may land this long after the cue window ends
  target_fp_per_min: 1.0
  thr_grid: [0.3, 0.4, 0.5, 0.6, 0.7, 0.8, 0.9, 0.95]
  min_none_block_s: 20.0         # none windows at least this long count as free activity
